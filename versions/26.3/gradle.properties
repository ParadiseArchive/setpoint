# Setpoint for Minecraft 26.3 (the default build: ./gradlew build)
minecraft_version=26.3
# The Minecraft versions the jar says it runs on
minecraft_version_range=[26.3]
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=26.3.0.99

# Optional integration and dev client mods (Modrinth version ids)
jade_version=26.3.5+neoforge
jei_version=UpgUiEy4
# Only in the dev client: mezzconfig for JEI, Sodium 0.9.3 beta (0.9.2 does not run on NeoForge 26.3) and Iris for shaders
dev_mods=mezzconfig:WFeT02Wv,sodium:SS023RVV,iris:Ag5S66CF

# Folders of the shared resources that this version reads differently (comma separated)
resources_exclude=

# Mixins this version needs (none on 26.3)
mixin_config=
