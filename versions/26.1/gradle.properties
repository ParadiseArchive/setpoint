# Setpoint for Minecraft 26.1.2, the version of All the Mods 11 (./gradlew build -Pmc=26.1)
minecraft_version=26.1.2
# The Minecraft versions the jar says it runs on
minecraft_version_range=[26.1.2]
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=26.1.2.109

# Optional integration and dev client mods (Modrinth version ids)
jade_version=26.1.12+neoforge
jei_version=7qmEzno8
# Only in the dev client
dev_mods=

# Data files that 26.1 reads differently: tools/port-26.1.mjs writes the 26.1 ones into versions/26.1/resources
resources_exclude=data/setpoint/worldgen/feature/,data/setpoint/loot_table/

# Mixins: water and lava flow round Setpoint blocks, as on 26.3 (versions/26.1/java/.../mixin)
mixin_config=setpoint.mixins.json
