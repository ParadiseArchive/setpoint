# Mod metadata. The dollar-brace placeholders are filled in from gradle.properties.
license="${mod_license}"
issueTrackerURL="https://github.com/ParadiseArchive/setpoint/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://hookdev.io/projects/minecraft-mods/"
authors="Hook Development"
description='''
Process engineering for Minecraft. Pumps that cavitate, tanks that overpressure,
control valves and PID loops you have to tune, and a control room to run it all.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
