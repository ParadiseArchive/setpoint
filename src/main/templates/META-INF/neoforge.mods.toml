# Mod metadata. The dollar-brace placeholders are filled in from gradle.properties.
license="${mod_license}"
issueTrackerURL="https://github.com/ParadiseArchive/setpoint/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://hookdev.io/projects/minecraft-mods/setpoint/"
bannerFile="logo.png"
authors="Hook Development"
description='''
Process engineering for Minecraft. Build a plant of pumps, tanks, valves and
controllers, run it from a DCS console and draw it as a live P&ID. Steam with real
pressure, gases, logistics, and Hookonium, a purple endgame ore.
Easy by default, real physics underneath.
'''

<% if (mixin_config) { %>[[mixins]]
config="${mixin_config}"
<% } %>[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
