# Mod metadata. The dollar-brace placeholders are filled in from gradle.properties.
license="${mod_license}"
issueTrackerURL="https://github.com/ParadiseArchive/setpoint/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://hookdev.io/projects/minecraft-mods/setpoint/"
bannerFile="logo.png"
authors="Hook Development"
description='''
Process engineering for Minecraft. Pumps that cavitate, controllers that hold a tank
level by themselves, power from coal and steam, and Hookonium, a purple endgame ore.
Easy by default, real physics underneath.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
