name: Publish to CurseForge

# Uploads a release to the CurseForge project page.
# - Push a version tag (v + mod_version from gradle.properties, e.g. v0.1.0-alpha): build, test and upload.
# - Or start it by hand on the Actions tab: "check" only tests the token and finds the game versions,
#   "upload" builds, tests and uploads the current mod_version.
# The changelog comes from release/changelog/<mod_version>.md; alpha or beta in the version sets the release type.
# Needs the repository secret CURSEFORGE_TOKEN (an upload token from https://authors.curseforge.com/#/settings/api-tokens).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = only test the token and game versions, upload = build, test and upload'
        type: choice
        options: [check, upload]
        default: check

permissions:
  contents: read

env:
  CF_PROJECT: '1763561'
  CF_API: https://minecraft.curseforge.com/api

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read the version
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          mc=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mod_version $version (expected v$version)"; exit 1
          fi
          case "$version" in *alpha*) type=alpha ;; *beta*) type=beta ;; *) type=release ;; esac
          echo "VERSION=$version" >> "$GITHUB_ENV"; echo "MC=$mc" >> "$GITHUB_ENV"; echo "TYPE=$type" >> "$GITHUB_ENV"
          echo "Setpoint $version ($type) for Minecraft $mc"

      - name: Find the game versions on CurseForge
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          [ -n "$CF_TOKEN" ] || { echo "::error::The secret CURSEFORGE_TOKEN is missing"; exit 1; }
          curl -sS --fail-with-body -H "X-Api-Token: $CF_TOKEN" "$CF_API/game/version-types" > types.json
          curl -sS --fail-with-body -H "X-Api-Token: $CF_TOKEN" "$CF_API/game/versions" > versions.json
          # Minecraft itself, the loader and the Java version, each by its name in its own version type
          jq --arg mc "$MC" --slurpfile types types.json '
            ($types[0] | map({key: (.id | tostring), value: .slug}) | from_entries) as $slug
            | map(. + {type: $slug[.gameVersionTypeID | tostring]})
            | map(select(
                ((.type // "" | startswith("minecraft-")) and .name == $mc)
                or (.type == "modloader" and .name == "NeoForge")
                or (.type == "java" and .name == "Java 25")))' versions.json > found.json
          jq -r '.[] | "  found: \(.name) (\(.type), id \(.id))"' found.json
          jq -e --arg mc "$MC" 'any(.name == $mc)' found.json > /dev/null || { echo "::error::CurseForge does not know Minecraft $MC yet"; exit 1; }
          jq -e 'any(.name == "NeoForge")' found.json > /dev/null || { echo "::error::NeoForge not found on CurseForge"; exit 1; }
          echo "GAME_VERSIONS=$(jq -c 'map(.id)' found.json)" >> "$GITHUB_ENV"

      - name: Setup JDK 25
        if: github.event_name == 'push' || inputs.mode == 'upload'
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        if: github.event_name == 'push' || inputs.mode == 'upload'
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        if: github.event_name == 'push' || inputs.mode == 'upload'
        run: ./gradlew build runGameTestServer

      - name: Upload to CurseForge
        if: github.event_name == 'push' || inputs.mode == 'upload'
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          changelog="release/changelog/$VERSION.md"
          jar="build/libs/setpoint-$VERSION.jar"
          [ -f "$changelog" ] || { echo "::error::$changelog is missing"; exit 1; }
          [ -f "$jar" ] || { echo "::error::$jar was not built"; exit 1; }
          jq -n --rawfile changelog "$changelog" --arg name "Setpoint $VERSION" --arg type "$TYPE" --argjson ids "$GAME_VERSIONS" \
            '{changelog: $changelog, changelogType: "markdown", displayName: $name, gameVersions: $ids, releaseType: $type}' > metadata.json
          curl -sS --fail-with-body -H "X-Api-Token: $CF_TOKEN" \
            -F "metadata=<metadata.json" -F "file=@$jar" \
            "$CF_API/projects/$CF_PROJECT/upload-file"
          echo; echo "Uploaded Setpoint $VERSION to CurseForge project $CF_PROJECT"
