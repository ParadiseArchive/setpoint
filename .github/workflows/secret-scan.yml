name: Secret scan

# Looks through every commit for passwords, tokens and keys (gitleaks), on every push and pull request.
# A find fails the run: then the secret must be revoked at once, even if the commit is removed afterwards.

on: [push, pull_request]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the whole history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan with gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --verbose --exit-code 1
